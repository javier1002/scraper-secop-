<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resolución y Scraping SECOP II</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        h2 { margin-bottom: 5px; }
        #status-log {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        .container {
            display: inline-block;
            border: 2px solid #ccc;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background: #fff;
        }
        #secop-viewport {
            cursor: pointer;
            display: block;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <h2>Control Remoto SECOP II</h2>
    <div id="status-log">Conectando al servidor...</div>

    <div class="container">
        <img id="secop-viewport" onclick="sendClick(event)" alt="Cargando vista previa de SECOP II..." />
    </div>

    <script>
        const ws = new WebSocket("ws://localhost:8000/ws");
        const imgElement = document.getElementById('secop-viewport');
        const logElement = document.getElementById('status-log');

        ws.onopen = () => {
            logElement.innerText = "Conectado. Esperando imagen de SECOP II...";
        };

        ws.onmessage = (event) => {
            const response = JSON.parse(event.data);

            if (response.type === "image") {
                imgElement.src = response.data;
                logElement.innerText = "Haga clic sobre el reCAPTCHA o la pantalla para interactuar.";
            } 
            else if (response.type === "status") {
                logElement.innerText = response.message;
            } 
            else if (response.type === "download") {
                logElement.innerText = "¡Proceso finalizado! Descargando datos...";
                
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(response.payload, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", response.filename);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            }
        };

        ws.onerror = () => {
            logElement.innerText = "Error de conexión. Verifica que el contenedor Docker esté corriendo en el puerto 8000.";
        };

        ws.onclose = () => {
            logElement.innerText = "Conexión cerrada.";
        };

        function sendClick(event) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;

            const rect = imgElement.getBoundingClientRect();
            const scaleX = imgElement.naturalWidth / rect.width;
            const scaleY = imgElement.naturalHeight / rect.height;

            const realX = Math.round((event.clientX - rect.left) * scaleX);
            const realY = Math.round((event.clientY - rect.top) * scaleY);

            ws.send(JSON.stringify({
                action: "click",
                x: realX,
                y: realY
            }));
        }
    </script>
</body>
</html>
